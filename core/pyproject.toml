# Python 核心包配置
# Created on 2026-11-01; Updated on 2026-11-03
# @author: https://github.com/Linmoqian
[project]
name = "xiaoxia-core"
version = "1.0.0"
description = "小虾台采集、通信、训练与推理核心"
requires-python = ">=3.11"
dependencies = [
    "lerobot[feetech]==0.4.4",
    "mujoco==3.15.0",
    "openai==2.24.0",
    "python-dotenv>=1,<2",
    "mcp>=1.26,<2",
    "PyYAML>=6.0.2,<7",
    "numpy>=2.2,<3",
    "Pillow>=10,<13",
    "cv2-enumerate-cameras==1.4.0",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.optional-dependencies]
text-vision = ["rapidocr_onnxruntime==1.2.3"]
physics-tools = ["coacd==1.0.14", "trimesh>=4.6,<5", "scipy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/xiaoxia_core"]
